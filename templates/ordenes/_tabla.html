<table class="tabla">
  <thead><tr><th>N.º</th><th>Cliente</th><th>Equipo</th><th>Estado</th><th>Técnico</th><th>Ingreso</th></tr></thead>
  <tbody>
  {% for o in ordenes %}
  <tr>
    <td><a href="{% url 'detalle_orden' o.pk %}">{{ o }}</a></td>
    <td>{{ o.equipo.cliente.nombre }}</td>
    <td>{{ o.equipo }}</td>
    <td><span class="chip est-{{ o.estado }}">{{ o.get_estado_display }}</span></td>
    <td>{{ o.tecnico.get_full_name|default:"—" }}</td>
    <td>{{ o.fecha_ingreso|date:"d/m/Y" }}</td>
  </tr>
  {% empty %}<tr><td colspan="6" class="vacio">No hay órdenes.</td></tr>{% endfor %}
  </tbody>
</table>
